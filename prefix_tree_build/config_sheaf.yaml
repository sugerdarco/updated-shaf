models:
  - "Qwen/Qwen2.5-0.5B-Instruct"
  - "google/gemma-2-2b-it"
  - "meta-llama/Llama-3.2-1B-Instruct"

device: "cuda"
dtype: "bfloat16"
out_dir: "out"

gate:
  entropy_threshold: 1.5
  divergence_threshold: 0.25
  mad_multiplier: 3.0

sheaf:
  top_k: 16
  max_new_bytes: 256
  tree_path: "artifacts/prefix_tree.npz"
